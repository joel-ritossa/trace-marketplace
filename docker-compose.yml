name: trace-marketplace

# Supabase (Postgres, auth, storage) runs on the host via `supabase start`;
# containers reach it at host.docker.internal. Ports come from .env and must
# match supabase/config.toml.

x-backend-env: &backend-env
  DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:${SUPABASE_DB_PORT:-55322}/postgres
  REDIS_URL: redis://redis:6379/0
  SUPABASE_URL: http://host.docker.internal:${SUPABASE_API_PORT:-55321}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  # Dev surface + fault injection; the worker honors X-Fault markers only when
  # this is set. Defaults on for the local stack, overridable from .env.
  DEV_ROUTES: ${DEV_ROUTES:-true}
  # Analysis (stage 2): pass-through when set in .env / the shell, omitted
  # when unset (a bare key would poison the keyless skip: an empty-string
  # provider key counts as configured). Keyless = the judge skips honestly.
  ANALYSIS_JUDGE_MODEL:
  ANALYSIS_JUDGE_VOTES:
  ANALYSIS_JUDGE_CONSENSUS:
  ANALYSIS_CONFIDENCE_THRESHOLD:
  ANALYSIS_LOOP_N:
  ANALYSIS_RENDER_BUDGET_TOKENS:
  ANALYSIS_RENDER_FINAL_STEPS:
  ANALYSIS_RENDER_TOOL_FIELD_CAP_CHARS:
  ANALYSIS_RENDER_CONVERSATION_CAP_CHARS:
  OPENAI_API_KEY:
  ANTHROPIC_API_KEY:
  OPENROUTER_API_KEY:

services:
  redis:
    image: redis:7-alpine
    # Published on 56379 to avoid colliding with other local Redis instances;
    # in-network services use redis:6379.
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: services/api
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # The image has no curl; stdlib urllib raises on non-2xx.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: services/api
    command: ["taskiq", "worker", "app.worker:broker", "--max-async-tasks", "4"]
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    build: services/api
    command: ["taskiq", "scheduler", "app.worker.scheduler:scheduler"]
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:55321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      SUPABASE_INTERNAL_URL: http://host.docker.internal:${SUPABASE_API_PORT:-55321}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
