  - acquire_flips_to_download_in_place
  - inspection_ungated_for_listed_traces          # severity: spec
  - disabled_download_carries_reason              # severity: spec
  - confirmation_names_specific_object
  - confirmation_states_real_consequences
  # Visibility consent
  - consent_checkbox_unchecked_by_default         # severity: spec
  - confirm_disabled_until_checkbox_checked       # severity: spec
  - dialog_states_exposure_scope_concretely
  - unlist_is_single_click
  # States
  - single_not_found_rendering_for_404_and_no_access  # severity: spec
  - not_found_offers_recovery_navigation

