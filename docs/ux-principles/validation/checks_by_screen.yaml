  - tags_description_editable_inline_for_owner
  - edit_controls_invisible_to_non_owners
  # Span tree
  - every_span_rendered_including_orphans         # severity: spec
  - node_shows_name_kind_duration_status_without_interaction
  - error_spans_flagged_with_icon_plus_color      # severity: spec
  - collapsed_ancestors_roll_up_error_counts
  - timeline_bars_share_one_time_axis
  - span_truncation_states_total_count
  - expansion_and_selection_survive_lazy_loading
  - tree_supports_arrow_key_navigation
  # Detail panel
