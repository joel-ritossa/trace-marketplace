# Machine-Reviewable Checks by Screen Type
# A reviewing agent loads the entry for the screen under review and verifies
# each check against the implementation (code reading and/or rendered UI).
# Checks are boolean. `severity: spec` = violates normative spec; must block.
# `severity: principle` = violates this repo; fix unless explicitly waived.
#
# Cross-references: each check_id is defined in the named principle file.

universal:
  # Apply to every screen, every time.
  checks:
    - id: loading_empty_error_states_present_on_every_data_view
      severity: principle
    - id: exactly_one_primary_button_per_screen_state
      severity: principle
    - id: api_error_detail_rendered_verbatim
      severity: spec
    - id: visibility_badge_on_every_trace_rendering
      severity: spec
    - id: disabled_actions_carry_inline_reason
      severity: principle
    - id: no_state_encoded_by_color_alone
      severity: principle
    - id: all_actions_keyboard_operable
      severity: principle
    - id: nav_visible_on_all_authenticated_routes
      severity: principle
    - id: shell_is_top_header_no_sidebar
      severity: principle
    - id: inspection_surfaces_get_full_viewport_width
      severity: principle
    - id: ui_terms_match_spec_vocabulary
      severity: principle
    - id: no_confirmation_on_reversible_or_idempotent_actions
      severity: principle

screen_type: auth
applies_to: [landing, sign_in, sign_up]
checks:
  - signup_fields_limited_to_auth_requirements
  - sign_in_and_sign_up_cross_linked
  - field_format_errors_inline
  - credential_errors_non_enumerating
  - post_auth_redirect_to_requested_url
  - signed_in_root_redirects_to_library
  - input_preserved_on_submit_failure
  - pending_state_prevents_double_submit

---
screen_type: upload_flow
applies_to: [upload]
checks:
  - client_side_size_and_type_checks_before_post
  - accepted_format_and_limit_in_idle_copy
  - drop_zone_doubles_as_keyboard_accessible_picker
  - current_status_name_rendered_during_polling
  - no_fabricated_progress_percentages
  - terminal_state_replaces_polling_ui
  - complete_state_links_to_created_traces
  - failed_state_shows_verbatim_error_and_retry   # severity: spec
  - warnings_shown_adjacent_to_success            # severity: spec
  - duplicate_state_visually_distinct_from_failure
  - duplicate_state_links_to_existing_upload      # severity: spec
  - no_navigation_blocking_after_accepted_post

